name: Rebuild trust index

on:
  push:
    branches: [main]
    paths:
      - "experiences/**/*.md"
      - "confirmations/*.json"
      - "scripts/rebuild_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-index-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Revalidate inert data
        run: python scripts/validate_contribution.py --local-root .
      - name: Compute confidence and effective status
        run: python scripts/rebuild_index.py
      - name: Commit generated index when changed
        shell: bash
        run: |
          if git diff --quiet -- index.json; then
            exit 0
          fi
          git config user.name "diana-mcp-knowledge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.json
          git commit -m "knowledge: rebuild trust index [skip ci]"
          git push origin HEAD:main
